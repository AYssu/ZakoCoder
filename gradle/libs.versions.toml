[versions]
agp = "9.5.0"
kotlin = "2.2.21"
compose-bom = "2026.02.01"
activity = "1.10.1"
core = "1.16.0"
coroutines = "1.10.2"

commons-compress = "1.27.1"
xz = "1.12"
lifecycle = "2.10.0"
junit = "4.13.2"
annotation = "1.9.0"
test-runner = "1.6.2"
test-core = "1.6.1"

sora = "0.23.6"
okhttp = "5.5.1"

[libraries]
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.2" }
commonmark = { module = "org.commonmark:commonmark", version = "0.31.0" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version = "0.31.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mock = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
sora-editor = { module = "io.github.Rosemoe.sora-editor:editor", version.ref = "sora" }
sora-textmate = { module = "io.github.Rosemoe.sora-editor:language-textmate", version.ref = "sora" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-core = { module = "androidx.test:core-ktx", version.ref = "test-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

android-library = { id = "com.android.library", version.ref = "agp" }
