name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version-file: native-kernel/go.version
          cache: false
      - name: Restore CI debug signing key
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.ZAKOCODER_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CI_DEBUG_KEYSTORE_BASE64" ]]; then
            echo '::error::Missing ZAKOCODER_DEBUG_KEYSTORE_BASE64 repository secret; see docs/RELEASING.md.'
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$CI_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build four Debug distributions and optional Lite plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_repository.py
          for abi in arm64-v8a x86_64; do
            python3 scripts/prepare_runtime.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi "$abi" --build-from-source
          done
          python3 scripts/prepare_proxy_kernel.py --abis arm64-v8a x86_64 --force --strict-hash
          ./gradlew :app:lintDebug --stacktrace
          mkdir -p apk-output
          version="debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          for edition in lite full; do
            for abi in arm64-v8a x86_64; do
              ./gradlew :app:assembleDebug -PdistributionEdition="$edition" -PcompatibilityAbis="$abi" --stacktrace
              name="ZakoCoder-$version-$edition-$abi.apk"
              "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" \
                --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
                --out "apk-output/$name" app/build/outputs/apk/debug/app-debug.apk
              rm -f "apk-output/$name.idsig"
            done
          done
          python3 scripts/distribution.py --directory apk-output --version "$version" --debug \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir -p plugin-output
          for abi in arm64-v8a x86_64; do
            ./gradlew :kernel-plugin:assembleDebug :kernel-plugin:lintDebug -PcompatibilityAbis="$abi" --stacktrace
            cp kernel-plugin/build/outputs/apk/debug/kernel-plugin-debug.apk "plugin-output/ZakoCoder-kernel-plugin-debug-$abi.apk"
          done
          (cd plugin-output && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' \
            'ZakoCoder Lite/Full ARM64/x86_64 Debug test builds; not production releases.' \
            "Commit: $GITHUB_SHA" \
            "Ref: $GITHUB_REF" \
            "Run: $GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT)" \
            'Signed with the repository CI debug key; local debug signatures may differ.' \
            'The kernel plugin APK is optional for Lite; Full integrates the kernel.' \
            'Upgrading does not automatically replace the installed Ubuntu environment.' \
            > apk-output/BUILD.txt
          python3 native-runtime/bundle_sources.py --output apk-output/native-runtime-sources.tar.gz
      - name: Upload optional Lite plugin
        uses: actions/upload-artifact@v7
        with:
          name: ZakoCoder-optional-kernel-plugin-${{ github.run_number }}-${{ github.run_attempt }}
          path: plugin-output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test APK
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ZakoCoder-debug-four-distributions-${{ github.run_number }}-${{ github.run_attempt }}
          path: apk-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Show download link
        env:
          APK_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          printf '## Lite / Full · ARM64 / x86_64 Debug 测试包\n\n[下载四个 APK、SHA-256 和包体检查记录](%s)\n\n' "$APK_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '保存 14 天，需要登录 GitHub 下载。这是测试包，不是正式 Release；PRoot 发行门槛保持不变。' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$HOME/.android/debug.keystore"
