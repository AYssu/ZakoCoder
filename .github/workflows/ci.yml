name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/check_repository.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_commit_message.py --title "$PR_TITLE"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Rebuild both runtime ABIs from source and compare pinned artifacts
        run: |
          python3 scripts/prepare_runtime.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi arm64-v8a --build-from-source
          python3 scripts/prepare_runtime.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi x86_64 --build-from-source
          python3 native-runtime/checks/verify.py native-runtime/prebuilt/arm64-v8a
          python3 native-runtime/checks/verify.py native-runtime/prebuilt/x86_64 --abi x86_64
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest --stacktrace
      - uses: actions/setup-go@v7
        with:
          go-version-file: native-kernel/go.version
          cache: false
      - name: Check all four distribution builds and actual package inventories
        run: |
          set -euo pipefail
          mkdir -p distribution-ci
          for edition in lite full; do
            for abi in arm64-v8a x86_64; do
              ./gradlew :app:assembleDebug -PdistributionEdition="$edition" -PcompatibilityAbis="$abi" --stacktrace
              cp app/build/outputs/apk/debug/app-debug.apk "distribution-ci/ZakoCoder-ci-$edition-$abi.apk"
            done
          done
          python3 scripts/distribution.py --directory distribution-ci --version ci --debug \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Verify self-built runtime artifacts and regression checks
        run: |
          python3 native-runtime/checks/verify.py
          python3 -m unittest discover -s native-runtime/checks -p 'test_*.py' -v
          python3 native-runtime/bundle_sources.py
      # Automatic CI does not upload APKs; build-apk.yml provides manual Debug test artifacts.
      # Beta publication is a separate manually dispatched, signed and validated workflow; stable release remains gated.

  kernel-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version-file: native-kernel/go.version
          cache: false
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Rebuild both Xray ABIs independently of repository binaries
        run: python3 scripts/prepare_proxy_kernel.py --abis arm64-v8a x86_64 --force --strict-hash
      - name: Build and verify the optional kernel plugin
        run: |
          set -euo pipefail
          python3 scripts/prepare_proxy_kernel.py
          ./gradlew :kernel-plugin:assembleDebug :kernel-plugin:lintDebug :kernel-plugin:testDebugUnitTest --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify kernel-plugin/build/outputs/apk/debug/kernel-plugin-debug.apk
          sha256sum kernel-plugin/build/outputs/apk/debug/kernel-plugin-debug.apk

